spring.application.name=SchoolManagementSystem
# Inject custom CSS
springdoc.swagger-ui.custom-css=/custom.css

# Add live search filter bar at the top
springdoc.swagger-ui.filter=true

# Keep sections collapsed on load for a clean dashboard view
springdoc.swagger-ui.doc-expansion=none

# Alphabetical sorting for clean navigation
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# Display operation duration (latency tracking)
springdoc.swagger-ui.display-request-duration=true
spring.mvc.problemdetails.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:5432/school_management
spring.datasource.username=school_admin
spring.datasource.password=secret_password

# Wichtig für PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Generiert Tabellen automatisch anhand deiner Entitäten (Nur für Entwicklung!)
spring.jpa.hibernate.ddl-auto=update